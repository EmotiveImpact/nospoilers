name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fixtures
      - name: Fixture packs must pass or fail closed
        run: npm run ci:fixtures
      - name: Clean pack SARIF
        run: npx tsx src/cli.ts scan fixtures/clean.tgz --sarif nospoilers.sarif
