name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fixtures
      - name: Clean pack must pass
        run: npx tsx src/cli.ts scan fixtures/clean.tgz --sarif nospoilers.sarif
      - name: Source map tarball must fail
        run: |
          if npx tsx src/cli.ts scan fixtures/sourcemap.tgz; then
            echo "expected a failing scan" >&2
            exit 1
          fi
      - name: Source map asar must fail
        run: |
          if npx tsx src/cli.ts scan fixtures/sourcemap.asar; then
            echo "expected a failing asar scan" >&2
            exit 1
          fi
      - name: Source map zip must fail
        run: |
          if npx tsx src/cli.ts scan fixtures/sourcemap.zip; then
            echo "expected a failing zip scan" >&2
            exit 1
          fi
