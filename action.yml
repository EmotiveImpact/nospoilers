name: NoSpoilers
description: Fail the job if a packed artifact contains source maps, secrets, or a .git directory.
author: NoSpoilers
branding:
  icon: eye-closed
  color: red
inputs:
  path:
    description: Directory, npm tarball, zip, or Electron asar to scan
    required: true
  strict:
    description: Also fail on warnings (TypeScript source packed, size spikes, etc.)
    required: false
    default: "false"
  policy:
    description: Path to .nospoilers.yml or JSON policy. Empty uses workspace .nospoilers.yml if present.
    required: false
    default: ""
  sarif:
    description: Workspace-relative path to write a SARIF 2.1 report. Empty skips the file.
    required: false
    default: "nospoilers.sarif"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install NoSpoilers
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Scan packed artifact
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        EXTRA=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          EXTRA="--strict"
        fi
        TARGET="${{ inputs.path }}"
        case "$TARGET" in
          /*) ;;
          *) TARGET="${GITHUB_WORKSPACE}/${TARGET}" ;;
        esac
        SARIF_ARGS=""
        if [ -n "${{ inputs.sarif }}" ]; then
          SARIF_PATH="${{ inputs.sarif }}"
          case "$SARIF_PATH" in
            /*) ;;
            *) SARIF_PATH="${GITHUB_WORKSPACE}/${SARIF_PATH}" ;;
          esac
          SARIF_ARGS="--sarif $SARIF_PATH"
        fi
        POLICY_ARGS=""
        if [ -n "${{ inputs.policy }}" ]; then
          POLICY_PATH="${{ inputs.policy }}"
          case "$POLICY_PATH" in
            /*) ;;
            *) POLICY_PATH="${GITHUB_WORKSPACE}/${POLICY_PATH}" ;;
          esac
          POLICY_ARGS="--policy $POLICY_PATH"
        elif [ -f "${GITHUB_WORKSPACE}/.nospoilers.yml" ]; then
          POLICY_ARGS="--policy ${GITHUB_WORKSPACE}/.nospoilers.yml"
        fi
        npx tsx src/cli.ts scan "$TARGET" $EXTRA $SARIF_ARGS $POLICY_ARGS
