name: NoSpoilers
description: Fail the job if a packed artifact contains source maps, secrets, or a .git directory.
author: NoSpoilers
branding:
  icon: eye-closed
  color: red
inputs:
  path:
    description: Directory, npm tarball, zip, Docker/OCI image, or Electron asar to scan
    required: true
  strict:
    description: Also fail on warnings (TypeScript source packed, size spikes, etc.)
    required: false
    default: "false"
  policy:
    description: Path to .nospoilers.yml or JSON policy. Empty uses workspace .nospoilers.yml if present. Ignored when api-token is set.
    required: false
    default: ""
  sarif:
    description: Workspace-relative path to write a SARIF 2.1 report. Empty skips the file.
    required: false
    default: "nospoilers.sarif"
  api-url:
    description: Hosted NoSpoilers origin for POST /api/v1/scan. Empty keeps the local CLI scan.
    required: false
    default: ""
  api-token:
    description: Scan API token from Watch. Empty keeps the local CLI scan. Store as a GitHub Actions secret.
    required: false
    default: ""
  channel:
    description: stable, beta, or canary for the hosted release revision. Empty infers from the git ref when using the scan API.
    required: false
    default: ""
  source-revision:
    description: Git SHA, tag, or version stored on the hosted release revision. Empty uses GITHUB_SHA when present.
    required: false
    default: ""
  ci-run:
    description: HTTPS CI run URL stored as metadata and never fetched. Empty uses this GitHub Actions run URL when present.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install NoSpoilers
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Scan packed artifact
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        NOSPOILERS_API_URL: ${{ inputs.api-url }}
        NOSPOILERS_API_TOKEN: ${{ inputs.api-token }}
        NOSPOILERS_CHANNEL: ${{ inputs.channel }}
        NOSPOILERS_SOURCE_REVISION: ${{ inputs.source-revision }}
        NOSPOILERS_CI_RUN: ${{ inputs.ci-run }}
      run: |
        EXTRA=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          EXTRA="--strict"
        fi
        TARGET="${{ inputs.path }}"
        case "$TARGET" in
          /*) ;;
          *) TARGET="${GITHUB_WORKSPACE}/${TARGET}" ;;
        esac
        if [ -n "$NOSPOILERS_API_TOKEN" ]; then
          API_URL="${NOSPOILERS_API_URL:-}"
          if [ -z "$API_URL" ]; then
            echo "api-token requires api-url (your NoSpoilers origin)." >&2
            exit 2
          fi
          npx tsx src/cli.ts scan "$TARGET" $EXTRA --api-url "$API_URL"
          exit $?
        fi
        SARIF_ARGS=""
        if [ -n "${{ inputs.sarif }}" ]; then
          SARIF_PATH="${{ inputs.sarif }}"
          case "$SARIF_PATH" in
            /*) ;;
            *) SARIF_PATH="${GITHUB_WORKSPACE}/${SARIF_PATH}" ;;
          esac
          SARIF_ARGS="--sarif $SARIF_PATH"
        fi
        POLICY_ARGS=""
        if [ -n "${{ inputs.policy }}" ]; then
          POLICY_PATH="${{ inputs.policy }}"
          case "$POLICY_PATH" in
            /*) ;;
            *) POLICY_PATH="${GITHUB_WORKSPACE}/${POLICY_PATH}" ;;
          esac
          POLICY_ARGS="--policy $POLICY_PATH"
        elif [ -f "${GITHUB_WORKSPACE}/.nospoilers.yml" ]; then
          POLICY_ARGS="--policy ${GITHUB_WORKSPACE}/.nospoilers.yml"
        fi
        npx tsx src/cli.ts scan "$TARGET" $EXTRA $SARIF_ARGS $POLICY_ARGS
