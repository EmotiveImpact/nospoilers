<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NoSpoilers production scan QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #050608; color: #fff; font: 12px system-ui; }
      header { height: 40px; display: grid; grid-template-columns: 1fr 1fr; place-items: center; border-bottom: 1px solid #333; }
      main { display: grid; height: calc(100vh - 40px); grid-template-columns: 1fr 1fr; gap: 1px; background: #333; }
      section { min-width: 0; background: #090a0c; }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <header><strong>Approved prototype · New Scan</strong><strong>Production implementation · /scan</strong></header>
    <main>
      <section><iframe src="./index.html?view=scan&amp;mode=package" title="Approved scan prototype"></iframe></section>
      <section><iframe src="/scan" title="Production scan implementation"></iframe></section>
    </main>
  </body>
</html>
